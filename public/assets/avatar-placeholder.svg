<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bgGrad)" rx="16"/>
  <rect width="600" height="750" fill="url(#spotlight)" rx="16"/>

  <!-- Subtle Blueprint Tech Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="500" y1="0" x2="500" y2="750"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>

  <!-- Elegant Geometric Ambient Glow Circle -->
  <circle cx="300" cy="270" r="160" fill="url(#glowGrad)" filter="blur(20px)"/>

  <!-- Silhouette Stylized Avatar Outline (Recruiter/Developer aesthetic) -->
  <g transform="translate(180, 150)">
    <!-- Head/Face outline -->
    <ellipse cx="120" cy="110" rx="65" ry="85" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Modern developer eyewear / focal line -->
    <path d="M 85 105 Q 120 115 155 105" stroke="#3B82F6" stroke-width="3" fill="none" opacity="0.8"/>
    <!-- Neck -->
    <path d="M 100 190 L 100 240 L 140 240 L 140 190 Z" fill="#172033" opacity="0.9"/>
    <!-- Shoulders / Torso -->
    <path d="M 10 320 C 30 250 80 230 120 230 C 160 230 210 250 230 320 Z" fill="#131B2E" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Tech Accent Framing Overlays -->
  <rect x="24" y="24" width="552" height="702" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="12"/>
  
  <!-- Frame Corner Accents -->
  <path d="M 24 60 L 24 24 L 60 24" fill="none" stroke="#8B5CF6" stroke-width="3"/>
  <path d="M 576 60 L 576 24 L 540 24" fill="none" stroke="#8B5CF6" stroke-width="3"/>
  <path d="M 24 690 L 24 726 L 60 726" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <path d="M 576 690 L 576 726 L 540 726" fill="none" stroke="#3B82F6" stroke-width="3"/>

  <!-- Developer Card Meta Overlay -->
  <g transform="translate(50, 570)">
    <rect width="500" height="120" rx="12" fill="#0B0F19" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Code status indicator -->
    <circle cx="35" cy="40" r="5" fill="#10B981"/>
    <text x="50" y="44" fill="#94A3B8" font-family="monospace" font-size="13" font-weight="600">PHOTO PLACEHOLDER • 600x750</text>
    
    <text x="35" y="75" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Avijit Dagur</text>
    <text x="35" y="98" fill="#8B5CF6" font-family="sans-serif" font-size="13" font-weight="500">Software Developer • B.Tech CSE</text>
    
    <!-- Tip message on how to replace -->
    <text x="470" y="85" text-anchor="end" fill="#64748B" font-family="monospace" font-size="11">Replace: /public/assets/avatar.jpg</text>
  </g>
</svg>
